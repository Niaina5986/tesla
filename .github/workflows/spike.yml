name: BOOM1000 SPIKE INTELLIGENCE

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: boom1000-spike
  cancel-in-progress: false

jobs:
  spike-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BOOM1000 analysis
        env:
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u spike.py

      - name: Save dataset
        run: |
          git config user.name "BOOM1000 Intelligence"
          git config user.email "actions@github.com"

          git add dataset.json

          if ! git diff --cached --quiet; then
            git commit -m "Update BOOM1000 intelligence dataset"
            git push origin HEAD:main
          else
            echo "No dataset changes"
          fi