name: TESLA REVERSE SCORE INTELLIGENCE

on:
  workflow_dispatch:
    inputs:
      simulations:
        description: "Nombre de simulations Monte Carlo"
        required: true
        default: "100000"

  push:
    paths:
      - "script.py"
      - "requirements.txt"
      - "data/tournaments/**"
      - ".github/workflows/tesla.yml"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TESLA
        run: |
          python script.py --simulations ${{ github.event.inputs.simulations || '100000' }}

      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TESLA-ANALYSIS-RESULTS
          path: output/
          if-no-files-found: warn
          retention-days: 30