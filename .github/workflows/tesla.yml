name: TESLA SPORTS INTELLIGENCE

on:

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tesla-sports
  cancel-in-progress: false

jobs:

  sports-intelligence:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout TESLA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Launch TESLA
        env:

          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: llama-3.3-70b-versatile

        run: python script.py

      - name: Save TESLA database
        run: |

          if [ -n "$(git status --porcelain -- tesla_data.json)" ]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add tesla_data.json

            git commit -m "TESLA: update sports signals and results"

            git push

          fi