name: TESLA V7 - Deep Score Investigation

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "script.py"
      - "data/tournaments/**"
      - ".github/workflows/tesla.yml"

permissions:
  contents: write

concurrency:
  group: tesla-v7-analysis
  cancel-in-progress: false

jobs:
  deep-score-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare directories
        run: |
          mkdir -p data/tournaments
          mkdir -p output

      - name: Run TESLA V7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESLA_BFS_STATE_LIMIT: "12000"
          TESLA_DFS_NODE_LIMIT: "30000"
          TESLA_MAX_ATOMS: "35"
          TESLA_MAX_DEPTH: "4"
          TESLA_MC_FORMULA_TRIALS: "100000"
          TESLA_MAX_FORMULAS: "40"
          TESLA_MAX_DISCOVERY_MATCHES: "370"
          TESLA_RANDOM_SEED: "42"
          TESLA_NOTIFICATION_INTERVAL: "3600"
        run: |
          python -u script.py

      - name: Save analysis and notification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/ tesla_notification_state.json

          if git diff --cached --quiet; then
            echo "No generated changes to save."
            exit 0
          fi

          git commit -m "TESLA V7: save analysis and hourly notification state"
          git pull --rebase origin main
          git push origin HEAD:main