name: BET261 PUBLIC COLLECTOR

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run collector
        env:
          BET261_URL: https://bet261.mg/sports/102
          COLLECTION_MINUTES: "25"
          INTERVAL_SECONDS: "15"
        run: python main.py

      - name: Save collected data
        run: |
          git config user.name "BET261 Collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/races.json
          git commit -m "Update Bet261 race observations" || echo "No changes"
          git push