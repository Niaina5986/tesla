name: TESLA SPORTS INTELLIGENCE V2

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tesla-sports-v2
  cancel-in-progress: false

jobs:

  tesla:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout TESLA
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run TESLA V2
        env:

          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python script.py

      - name: Save TESLA database
        run: |

          if [ -n "$(git status --porcelain -- tesla_data.json)" ]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add tesla_data.json

            git commit -m "TESLA V2 database update"

            git push

          fi